
[functions.dispatch-push-notifications]
enabled = true
verify_jwt = false
import_map = "./functions/dispatch-push-notifications/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/dispatch-push-notifications/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/dispatch-push-notifications/*.html" ]

[functions.cleanup-chat-files]
enabled = true
verify_jwt = false
entrypoint = "./functions/cleanup-chat-files/index.ts"

# Stage 16.2: user JWT for upload/download; CLEANUP_DISPATCH_SECRET / service_role for processCleanup.
[functions.subject-media]
enabled = true
verify_jwt = false
entrypoint = "./functions/subject-media/index.ts"

# Stage 16.3: managed content-media (local only; deploy owner-gated).
[functions.content-media]
enabled = true
verify_jwt = false
entrypoint = "./functions/content-media/index.ts"
