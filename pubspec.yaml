name: student_platform
description: MVP в стиле Cloudmate (Flutter)
publish_to: "none"
version: 1.0.0+10

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Навигация / сеть / состояния
  go_router: ^14.2.0
  dio: ^5.5.0+1
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Хранилище/настройки
  shared_preferences: ^2.3.2
  # get_storage: ^2.1.1  # Временно отключено

  # Медиа/файлы
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  path_provider: ^2.1.4
  open_filex: ^4.4.0

  # UI / ассеты
  lottie: ^3.1.2
  cached_network_image: ^3.4.1
  photo_view: ^0.14.0
  webview_flutter: ^4.2.1

  # Ссылки/утилиты
  url_launcher: ^6.3.0
  emoji_picker_flutter: ^4.3.0
  intl: ^0.20.0
  crypto: ^3.0.3
  http: ^1.1.0
  minio: ^3.5.8 # Yandex Object Storage (S3-compatible)
  vibration: ^3.0.0 # haptic feedback

  # === Supabase авторизация ===
  supabase_flutter: ^2.6.0
  bcrypt: ^1.1.3
  pdf: ^3.12.0
  pdfrx: ^2.4.4
  share_plus: ^12.0.2
  super_clipboard: 0.9.1
  flutter_chat_reactions: ^0.2.7
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.0.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Линтинг и метрики
  custom_lint: ^0.6.4
  dart_code_metrics_presets: ^2.15.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/images/teacher_difficulty/
    - assets/lottie/
    - assets/fonts/
    - assets/lottie/cat_sleeping.json

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
    - family: Allison
      fonts:
        - asset: assets/fonts/Allison-Regular.ttf
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript.ttf
